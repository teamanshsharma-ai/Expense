const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=iso(new Date()),curM=today.slice(0,7),cap=s=>s[0].toUpperCase()+s.slice(1);
/* ---------- local storage "database" (no server, no account) ---------- */
const LS='ledger.v1',fresh=()=>({profiles:[{id:'me',name:'',email:'',currency:'INR'}],incomes:[],expenses:[],budgets:[],savings_goals:[]});
let D;try{D=JSON.parse(localStorage.getItem(LS))||fresh()}catch(_){D=fresh()}

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
function from(t){let f=null,op='select',pl;const now=()=>new Date().toISOString(),q={select:()=>q,order:()=>q,eq:(k,v)=>(f=[k,v],q),insert:r=>(op='ins',pl=r,q),update:r=>(op='upd',pl=r,q),delete:()=>(op='del',q),upsert:r=>(op='ups',pl=r,q),
 then(ok){try{const L=D[t],m=x=>!f||x[f[0]]===f[1];
  if(op==='ins')L.push({id:uid(),created_at:now(),...pl});else if(op==='upd')L.forEach(x=>m(x)&&Object.assign(x,pl));else if(op==='del')D[t]=L.filter(x=>!m(x));
  else if(op==='ups'){const x=L.find(y=>y.category===pl.category&&y.month===pl.month);x?Object.assign(x,pl):L.push({id:uid(),created_at:now(),...pl})}
  if(op!=='select')persist();ok({data:D[t].slice(),error:null})}catch(e){ok({data:null,error:{message:e.message}})}}};return q}
const sb={from};
const S={user:{id:'me'},profile:null,incomes:[],expenses:[],budgets:[],goals:[],E:[],I:[],page:'dashboard',f:{q:'',cat:'',pay:'',per:'all',from:'',to:'',sort:'new'},aR:'month',calM:curM,calD:today,repM:curM};
const money=n=>{const c=S.profile?.currency||'INR',i=Math.abs(n%1)<.005;return new Intl.NumberFormat(c==='INR'?'en-IN':'en-US',{style:'currency',currency:c,minimumFractionDigits:i?0:2,maximumFractionDigits:i?0:2}).format(n)};
const mc=n=>{const c=S.profile?.currency||'INR';return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,notation:'compact',maximumFractionDigits:1}).format(n)};
const sym=()=>money(0).replace(/[\d.,\s]/g,''),fd=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const ml=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const addM=(m,n)=>{const[y,k]=m.split('-').map(Number);return iso(new Date(y,k-1+n,1)).slice(0,7)};
function nth(b,t,n){const[y,m,d]=b.split('-').map(Number);let x;if(t==='daily')x=new Date(y,m-1,d+n);else if(t==='weekly')x=new Date(y,m-1,d+7*n);else{const f=new Date(y,m-1+(t==='yearly'?12*n:n),1);x=new Date(f.getFullYear(),f.getMonth(),Math.min(d,new Date(f.getFullYear(),f.getMonth()+1,0).getDate()))}return iso(x)}
function expand(l){const o=[];for(const r of l){o.push(r);if(r.recurring&&r.recurring_type)for(let n=1;n<3000;n++){const d=nth(r.date,r.recurring_type,n);if(d>today)break;o.push({...r,date:d,rep:1})}}return o}
const sum=l=>l.reduce((s,x)=>s+Number(x.amount),0),rng=(l,[a,b])=>l.filter(x=>x.date>=a&&x.date<=b);
const byCat=l=>{const o={};l.forEach(x=>o[x.category]=(o[x.category]||0)+Number(x.amount));return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function per(k){const d0=n=>nth(today,'daily',-n),dow=(new Date().getDay()+6)%7,l=addM(curM,-1);
 return({today:[today,today],week:[d0(dow),today],month:[curM+'-01',curM+'-31'],last:[l+'-01',l+'-31'],'7d':[d0(6),today],'30d':[d0(29),today],'6m':[addM(curM,-5)+'-01',today],'12m':[addM(curM,-11)+'-01',today]})[k]||['0000-01-01','9999-12-31']}
const mt=m=>{const r=[m+'-01',m+'-31'],ex=rng(S.E,r),inn=rng(S.I,r),inc=sum(inn),exp=sum(ex);return{ex,inn,inc,exp,sav:inc-exp,rate:inc>0?(inc-exp)/inc*100:0}};
const bud=m=>{const o={};[...S.budgets].sort((a,b)=>a.month<b.month?-1:1).forEach(b=>{if(b.month<=m)o[b.category]=+b.amount});return o};
function alerts(){const b=bud(curM),s=Object.fromEntries(byCat(mt(curM).ex));return Object.entries(b).map(([c,a])=>{const v=s[c]||0,p=v/a*100;return{c,a,v,p,msg:p>=100?`${c} budget exceeded by ${money(v-a)}.`:p>=80?`You're close to your ${c} budget.`:''}})}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}

const fld=(f,v)=>{let h;const o=f.o||[];
 if(f.t==='num'||f.t==='num0')h=`<label>${f.l}<div class="amt"><span>${sym()}</span><input name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" value="${v??''}" ${f.af?'autofocus':''}></div></label>`;
 else if(f.chips)h=`<fieldset class="chips" style="--n:${f.cols||4}"><legend>${f.l}</legend>${o.map(x=>`<label class="chip"><input type="radio" name="${f.k}" value="${x}" ${x===v?'checked':''}><span>${f.ic?`<em class="cat-icon"><img src="${CAT_ASSETS[x]}" alt="" width="48" height="48" decoding="async"></em>`:''}${x}</span></label>`).join('')}</fieldset>`;
 else if(f.t==='sel')h=`<label>${f.l}<select name="${f.k}">${v?'':'<option value="">Select…</option>'}${o.map(x=>`<option value="${x}" ${x===v?'selected':''}>${cap(x)}</option>`).join('')}</select></label>`;
 else if(f.t==='bool')h=`<label class="chk"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
 else h=`<label>${f.l}<input name="${f.k}" type="${f.t==='date'?'date':'text'}" maxlength="120" value="${esc(v??'')}"></label>`;
 return f.dep?`<div data-dep="${f.dep}">${h}</div>`:h};
function form(title,fields,v,save,btn='Save'){const d=$('#dlg');
 d.innerHTML=`<form id="ff" novalidate><h2>${title}</h2>${fields.map(f=>fld(f,v[f.k])).join('')}<p class="err" id="ferr"></p><div class="fa"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" id="fs">${btn}</button></div></form>`;
 d.showModal();const ff=$('#ff'),sync=()=>ff.querySelectorAll('[data-dep]').forEach(e=>e.hidden=!ff.elements[e.dataset.dep].checked);ff.onchange=sync;sync();
 ff.onsubmit=async e=>{e.preventDefault();const o={};let err='';
  for(const f of fields){const el=ff.elements[f.k];let x=f.t==='bool'?el.checked:el.value.trim();
   if(f.dep&&!ff.elements[f.dep].checked){o[f.k]=null;continue}
   if(f.t==='num'||f.t==='num0'){x=parseFloat(x);if(!isFinite(x)||(f.t==='num'?x<=0:x<0))err=err||'Please enter a valid amount.'}
   else if(f.t==='date'){if(x?(isNaN(Date.parse(x))||x<'2000-01-01'||x>'2100-12-31'):f.r)err=err||'Please select a valid date.';if(!x)x=null}
   else if(f.r&&!x)err=err||`Please ${f.t==='sel'?'select a':'enter a'} ${f.n||f.l.toLowerCase()}.`;
   o[f.k]=x}
  if(err)return $('#ferr').textContent=err;
  $('#fs').disabled=true;try{await save(o);d.close();await load();render();toast('Saved')}catch(_){$('#fs').disabled=false}}}
const REC=['daily','weekly','monthly','yearly'];
const fExp=[{k:'amount',l:'Amount',t:'num',af:1},{k:'category',l:'Category',t:'sel',o:Object.keys(CATS),r:1,n:'category',chips:1,ic:1},{k:'date',l:'Date',t:'date',r:1},{k:'payment_method',l:'Payment method',t:'sel',o:PAY,r:1,n:'payment method',chips:1,cols:3},{k:'description',l:'Description (optional)',t:'text'},{k:'recurring',l:'Recurring expense',t:'bool'},{k:'recurring_type',l:'Repeats',t:'sel',o:REC,dep:'recurring',r:1,n:'frequency'}];

/* ---------- charts ---------- */
function donut(rows){const T=rows.reduce((s,r)=>s+r[1],0);if(!T)return'';let o=0;
 const arcs=rows.map((r,i)=>{const p=r[1]/T*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i%10]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}"><title>${esc(r[0])}</title></circle>`;o+=p;return s}).join('');
 return `<div class="dn"><svg viewBox="0 0 42 42" class="donut"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="#eceef1" stroke-width="6"/>${arcs}</svg><ul class="lg">${rows.map((r,i)=>`<li><i style="background:${PAL[i%10]}"></i>${esc(r[0])}<b>${Math.round(r[1]/T*100)}%</b><span>${money(r[1])}</span></li>`).join('')}</ul></div>`}
function bars(d){const mx=Math.max(...d.map(x=>x.v),1),W=600,H=170,bw=W/d.length,st=Math.ceil(d.length/12);
 return `<svg viewBox="0 0 ${W} ${H+22}" class="chart" role="img" aria-label="Expense trend">${d.map((x,i)=>{const h=x.v/mx*H;return `<rect x="${i*bw+bw*.15}" y="${H-h}" width="${bw*.7}" height="${x.v?Math.max(h,1.5):0}" rx="2" fill="#b42318"><title>${esc(x.l)}: ${money(x.v)}</title></rect>${i%st===0?`<text x="${i*bw+bw/2}" y="${H+15}" text-anchor="middle" font-size="11" fill="#667085">${esc(x.l)}</text>`:''}`}).join('')}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#e2e5e9"/></svg><p class="mu sm">Highest ${money(mx>1||d.some(x=>x.v)?Math.max(...d.map(x=>x.v)):0)}</p>`}
function trend(k){const[a,b0]=per(k),b=b0>today?today:b0;
 if(k==='6m'||k==='12m'){const n=k==='6m'?6:12;return Array.from({length:n},(_,i)=>{const m=addM(curM,i-n+1);return{l:new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'}),v:sum(rng(S.E,[m+'-01',m+'-31']))}})}
 const o={};S.E.forEach(x=>{if(x.date>=a&&x.date<=b)o[x.date]=(o[x.date]||0)+Number(x.amount)});const r=[];for(let d=a;d<=b;d=nth(d,'daily',1))r.push({l:d.slice(8),v:o[d]||0});return r}

const EMP={ex:()=>empty('No expenses yet.','Start tracking your spending by adding your first expense.','<button class="btn pri" data-a="addExp">Add expense</button>'),inc:()=>empty('No income added yet.','Add your salary or other income to start tracking your finances.','<button class="btn pri" data-a="addInc">Add income</button>'),an:()=>empty('','Add a few transactions to see your financial analytics.')};
const txRow=(x,k,act=true)=>`<div class="tx"><div class="ic">${k==='ex'?CATS[x.category]||'📦':'💰'}</div><div><b>${esc(x.description||(k==='ex'?x.category:x.type))}</b><small>${esc(k==='ex'?x.category:x.type)}${x.recurring?', repeats '+x.recurring_type:''}</small></div><div class="dm"><small>${fd(x.date)}${k==='ex'?'<br>'+esc(x.payment_method):''}</small></div><div class="am ${k==='ex'?'neg':'pos'}">${k==='ex'?'':'+'}${money(x.amount)}</div>${act?`<div class="ac"><button class="ib" data-a="${k}edit" data-id="${x.id}">Edit</button><button class="ib" data-a="${k}del" data-id="${x.id}">Delete</button></div>`:'<span></span>'}</div>`;
const cmp=(a,b)=>b.date.localeCompare(a.date)||(b.created_at||'').localeCompare(a.created_at||'');
function dash(){const t=mt(curM),bal=sum(S.I)-sum(S.E),nm=(S.profile?.name||'').split(' ')[0],h=new Date().getHours(),al=alerts().filter(a=>a.msg);
 const all=[...S.E.map(x=>({...x,k:'ex'})),...S.I.map(x=>({...x,k:'in'}))].sort(cmp).slice(0,8);let g='';
 const rec=all.map(x=>{const l=x.date===today?'Today':x.date===nth(today,'daily',-1)?'Yesterday':fd(x.date),hd=l!==g?`<h3>${l}</h3>`:'';g=l;return hd+txRow(x,x.k,false)}).join('');
 return `<div class="hd"><div><h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${nm?', '+esc(nm):''}</h1><p class="mu">${ml(curM)}<span class="dbal">. Current balance <b style="color:var(--tx)">${money(bal)}</b></span></p></div><div class="row"><button class="btn pri" data-a="addExp">+ Add expense</button><button class="btn" data-a="addInc">+ Add income</button></div></div>
 <div class="hero"><small>Current balance</small><b>${money(bal)}</b></div>
 <div class="g4"><div class="card stat"><small>Total income</small><b class="inc">${money(t.inc)}</b></div><div class="card stat"><small>Total expenses</small><b class="neg">${money(t.exp)}</b></div><div class="card stat"><small>Remaining balance</small><b>${money(t.sav)}</b><small>${t.inc?Math.round(t.rate)+'% of income kept':'This month'}</small></div><div class="card stat"><small>Total savings</small><b class="sav">${money(sum(S.goals.map(g=>({amount:g.saved_amount}))))}</b><small>In savings goals</small></div></div>
 <div class="g2"><div class="card"><div class="hd"><h2>Recent transactions</h2><button class="btn" data-a="go" data-id="expenses">View all</button></div>${rec||EMP.ex()}</div>

function exList(){const f=S.f;if(!S.expenses.length)return EMP.ex();const[a,b]=f.per==='custom'?[f.from||'0000-01-01',f.to||'9999-12-31']:per(f.per),q=f.q.toLowerCase();
 const l=S.expenses.filter(x=>x.date>=a&&x.date<=b&&(!f.cat||x.category===f.cat)&&(!f.pay||x.payment_method===f.pay)&&(!q||`${x.description} ${x.category} ${x.amount}`.toLowerCase().includes(q)));
 l.sort(f.sort==='old'?(a,b)=>-cmp(a,b):f.sort==='high'?(a,b)=>b.amount-a.amount:f.sort==='low'?(a,b)=>a.amount-b.amount:cmp);

function insights(){const t=mt(curM),l=mt(addM(curM,-1)),o=[],top=byCat(t.ex)[0];
 if(top)o.push(`Your highest spending category this month is ${top[0]} (${money(top[1])}).`);
 if(l.exp>0&&t.exp>0){const d=t.exp-l.exp;o.push(d>=0?`You spent ${money(d)} more this month than last month.`:`You spent ${money(-d)} less this month than last month.`)}
 if(t.inc>0){o.push(`Your savings rate is ${Math.round(t.rate)}%.`);o.push(t.sav>=0?`You have ${money(t.sav)} remaining from your monthly income.`:`You have spent ${money(-t.sav)} more than your income this month.`)}
 const lc=Object.fromEntries(byCat(l.ex));let best;byCat(t.ex).forEach(([c,v])=>{if(lc[c]>0&&v>lc[c]){const p=(v-lc[c])/lc[c]*100;if(!best||p>best[1])best=[c,p]}});

function analyticsPg(){const R=[['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['last','Last month'],['6m','Last 6 months'],['12m','Last 12 months']];
 let body=EMP.an();if(S.expenses.length+S.incomes.length){const r=per(S.aR),ex=rng(S.E,r),inc=sum(rng(S.I,r)),exp=sum(ex),sv=inc-exp,ins=insights();
 body=`<div class="g4"><div class="card stat"><small>Income</small><b class="inc">${money(inc)}</b></div><div class="card stat"><small>Expenses</small><b class="neg">${money(exp)}</b></div><div class="card stat"><small>Savings</small><b>${money(sv)}</b></div><div class="card stat"><small>Savings rate</small><b class="sav">${inc>0?Math.round(sv/inc*100)+'%':'–'}</b></div></div>
 <div class="g2"><div class="card"><h2>Where your money goes</h2>${ex.length?donut(byCat(ex)):'<p class="mu">No expenses in this period.</p>'}</div><div class="card"><h2>Insights</h2>${ins.length?ins.map(i=>`<div class="ins">${i}</div>`).join(''):'<p class="mu">Insights appear once you have a few transactions this month.</p>'}</div></div>
 <div class="card"><h2>Expense trend</h2>${bars(trend(S.aR))}</div>`}
 return `<div class="hd"><h1>Analytics</h1><select data-g="ar" style="width:auto">${opt(R,S.aR)}</select></div>${body}`}
function budgetsPg(){const al=alerts();return `<div class="hd"><div><h1>Budgets</h1><p class="mu">Monthly limits, applied to ${ml(curM)} and later months until you change them.</p></div><button class="btn pri" data-a="budnew">+ Set budget</button></div>
 ${al.length?al.map(a=>`<div class="card"><div class="hd"><b>${CATS[a.c]} ${a.c}</b><span class="row"><button class="ib" data-a="budedit" data-id="${a.c}">Edit</button><button class="ib" data-a="buddel" data-id="${a.c}">Remove</button></span></div>
 <div>${money(a.v)} / ${money(a.a)} <span class="mu">(${Math.round(a.p)}%)</span></div><div class="bar ${a.p>=100?'x':a.p>=80?'w':''}"><i style="width:${Math.min(a.p,100)}%"></i></div>${a.msg?`<small class="${a.p>=100?'neg':'wn'}">${a.msg}</small>`:`<small>${money(a.a-a.v)} left</small>`}</div>`).join(''):empty('No budgets yet.','Set a monthly limit for a category to track it here.','<button class="btn pri" data-a="budnew">Set budget</button>')}`}
function goalsPg(){return `<div class="hd"><div><h1>Savings goals</h1></div><button class="btn pri" data-a="goalnew">+ New goal</button></div>${S.goals.length?S.goals.map(g=>{const p=g.saved_amount/g.target_amount*100;return `<div class="card"><div class="hd"><b>${esc(g.name)}</b><small>${g.target_date?'Target '+fd(g.target_date):'No target date'}</small></div>
 <div>${money(g.saved_amount)} / ${money(g.target_amount)} <span class="mu">(${p.toFixed(1)}%)</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:var(--sav)"></i></div>
 <div class="row"><button class="btn" data-a="goaladd" data-id="${g.id}">Add money</button><button class="ib" data-a="goaledit" data-id="${g.id}">Edit</button><button class="ib" data-a="goaldel" data-id="${g.id}">Delete</button></div></div>`}).join(''):empty('No savings goals yet.','Create a goal to start saving toward it.','<button class="btn pri" data-a="goalnew">New goal</button>')}`}
function calendarPg(){const m=S.calM,[y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate(),sp={};
 rng(S.E,[m+'-01',m+'-31']).forEach(x=>sp[x.date]=(sp[x.date]||0)+Number(x.amount));
 const day=S.calD,dl=S.E.filter(x=>x.date===day);let c='';for(let i=0;i<first;i++)c+='<span></span>';
 for(let d=1;d<=dim;d++){const k=`${m}-${String(d).padStart(2,'0')}`;c+=`<button class="${k===day?'on':''}" data-a="day" data-id="${k}">${d}${sp[k]?`<b>${mc(sp[k])}</b>`:''}</button>`}
 return `<div class="hd"><h1>Calendar</h1><div class="row"><button class="btn" data-a="calp">‹</button><b>${ml(m)}</b><button class="btn" data-a="caln">›</button></div></div><div class="card"><div class="cal">${'SMTWTFS'.split('').map(x=>`<div>${x}</div>`).join('')}${c}</div></div>
 <div class="card"><h2>${fd(day)}${dl.length?`: ${money(sum(dl))} spent`:''}</h2>${dl.length?dl.map(x=>txRow(x,'ex',false)).join(''):'<p class="mu">No expenses on this day.</p>'}</div>`}
function reportPg(){const m=S.repM,t=mt(m),ms=[...new Set([...S.E,...S.I].map(x=>x.date.slice(0,7)))].sort().reverse(),dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),days=m===curM?+today.slice(8):dim,top=byCat(t.ex)[0],big=t.ex.reduce((a,b)=>!a||+b.amount>+a.amount?b:a,null);
 const st=(l,v,c='')=>`<div class="card stat"><small>${l}</small><b class="${c}">${v}</b></div>`;
 return `<div class="hd"><h1>Monthly report</h1><input type="month" data-g="rm" value="${m}" style="width:auto"></div>${t.ex.length||t.inn.length?`<div class="g4">${st('Total income',money(t.inc),'inc')}${st('Total expenses',money(t.exp),'neg')}${st('Total savings',money(t.sav))}${st('Savings rate',t.inc>0?Math.round(t.rate)+'%':'–','sav')}</div>
 <div class="g4">${st('Highest category',top?`${top[0]}: ${money(top[1])}`:'–')}${st('Transactions',t.ex.length)}${st('Average daily spending',money(t.exp/days))}${st('Largest expense',big?`${money(big.amount)}, ${big.category}`:'–')}</div>`:EMP.an()}
 ${ms.length?`<div class="card"><h2>All months</h2><table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Savings</th></tr>${ms.map(k=>{const x=mt(k);return `<tr data-a="rep" data-id="${k}"><td>${ml(k)}</td><td>${money(x.inc)}</td><td>${money(x.exp)}</td><td>${money(x.sav)}</td></tr>`}).join('')}</table></div>`:''}`}
function profilePg(){const p=S.profile||{};return `<h1>Profile & data</h1><div class="card" style="max-width:440px;margin-top:14px"><label>Your name<input id="p_n" value="${esc(p.name)}"></label><label>Currency<select id="p_c">${opt(['INR','USD','EUR','GBP','AED','AUD','CAD','SGD','JPY'],p.currency)}</select></label><p class="err" id="perr"></p><button class="btn pri" data-a="saveprof">Save profile</button></div><div class="card" style="max-width:440px"><h2>Your data</h2><p class="mu sm">Everything is stored privately in this browser on this device. Download a backup regularly and use it to move to another device.</p><div class="row"><button class="btn" data-a="export">Download backup</button><button class="btn" data-a="import">Restore backup</button><button class="btn" data-a="reset">Erase all data</button></div><input type="file" id="imp" accept=".json" hidden></div>`}
const PG={dashboard:dash,expenses:expensesPg,income:incomePg,analytics:analyticsPg,budgets:budgetsPg,goals:goalsPg,calendar:calendarPg,report:reportPg,profile:profilePg};
function render(){const lk=(a,c)=>NAV.map(([k,l])=>`<a class="${S.page===k?'on':''}" data-a="go" data-id="${k}">${l}</a>`).join('');
 $('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand">Ledger</div><button class="btn pri wide" data-a="addExp">+ Add expense</button><nav>${lk()}</nav><div class="sfoot">${esc(S.profile?.name||'Local profile')}<br>Saved on this device</div></aside>
 <main><header class="mbar"><div class="brand">Ledger</div><b>${NAV.find(n=>n[0]===S.page)[1]}</b></header><div class="tabs">${lk()}</div>${PG[S.page]()}</main><nav class="bnav">${[['dashboard','🏠','Home'],['expenses','🧾','Expenses'],['add','+','Add'],['analytics','📊','Analytics'],['profile','👤','Profile']].map(([k,i,l])=>k==='add'?`<a class="add" data-a="addExp"><span>${i}</span>${l}</a>`:`<a class="${S.page===k?'on':''}" data-a="go" data-id="${k}"><span>${i}</span>${l}</a>`).join('')}</nav></div>`;scrollTo(0,0);const ta=$('.tabs'),ac=$('.tabs a.on');if(ta&&ac)ta.scrollLeft=ac.offsetLeft-ta.clientWidth/2+ac.clientWidth/2}

/* ---------- actions ---------- */
const find=(l,id)=>l.find(x=>x.id===id),del=async(t,id,w)=>{if(!confirm(`Delete this ${w}? This cannot be undone.`))return;await db(sb.from(t).delete().eq('id',id));await load();render();toast('Deleted')};
const A={close:()=>$('#dlg').close(),go:(_,id)=>{S.page=id;render()},addExp:()=>openExp(),addInc:()=>openInc(),exedit:(_,id)=>openExp(find(S.expenses,id)),exdel:(_,id)=>del('expenses',id,'expense'),inedit:(_,id)=>openInc(find(S.incomes,id)),indel:(_,id)=>del('incomes',id,'income entry'),
 goalnew:()=>openGoal(),goaledit:(_,id)=>openGoal(find(S.goals,id)),goaldel:(_,id)=>del('savings_goals',id,'goal'),goaladd:(_,id)=>{const g=find(S.goals,id);form('Add money to '+esc(g.name),[{k:'amount',l:'Amount',t:'num',af:1}],{},v=>db(sb.from('savings_goals').update({saved_amount:+g.saved_amount+v.amount}).eq('id',id)),'Add money')},
 budnew:()=>openBud(),budedit:(_,id)=>openBud(id),buddel:async(_,id)=>{if(!confirm(`Remove the ${id} budget?`))return;await db(sb.from('budgets').delete().eq('category',id));await load();render()},
 day:(_,id)=>{S.calD=id;render()},calp:()=>{S.calM=addM(S.calM,-1);S.calD=S.calM+'-01';render()},caln:()=>{S.calM=addM(S.calM,1);S.calD=S.calM+'-01';render()},rep:(_,id)=>{S.repM=id;render()},
 async saveprof(){const n=$('#p_n').value.trim();if(!n)return $('#perr').textContent='Please enter your name.';await db(sb.from('profiles').update({name:n,currency:$('#p_c').value}).eq('id',S.user.id));await load();render();toast('Profile saved')},
 export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='ledger-backup-'+today+'.json';a.click()},
 import:()=>{const i=$('#imp');i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j.expenses||!j.incomes||!j.profiles)throw 0;if(!confirm('Replace all current data with this backup?'))return;D=j;persist();await load();render();toast('Backup restored')}catch(_){toast('That file is not a valid backup.',1)}};i.click()},
 async reset(){if(!confirm('Erase all data on this device? This cannot be undone.'))return;D=fresh();persist();await load();render()}};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])await A[t.dataset.a](t,t.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.auth'))$('.auth .btn').click()});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(!k)return;S.f[k]=e.target.value;if(k==='per')render();else $('#exlist').innerHTML=exList()});
document.addEventListener('change',e=>{const g=e.target.dataset.g;if(g==='ar'){S.aR=e.target.value;render()}if(g==='rm'){S.repM=e.target.value||curM;render()}});

load().then(render);
</script></body></html>
